      - scipy==1.15.3
      - trimesh==4.12.2
      - gmsh==4.15.2
      - networkx==3.4.2
      - fast-simplification==0.2.0
      - mkl-static==2024.2.2
      - mkl-include==2024.2.2
      - intel-openmp==2024.2.2
