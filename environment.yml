  - pip
  - setuptools>=68
  - cmake=3.31
  - make
  - time
  - gcc_linux-64=13
  - gxx_linux-64=13
  - libglu
  - libgl
  - xorg-libxrender
  - xorg-libxcursor
  - xorg-libxfixes
  - xorg-libxext
  - xorg-libxft
  - xorg-libxinerama
  - xorg-libx11
